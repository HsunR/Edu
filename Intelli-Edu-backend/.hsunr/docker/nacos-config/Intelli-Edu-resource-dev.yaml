spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    clean-disabled: true

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:intelli-edu}
  secret-key: ${MINIO_SECRET_KEY:intelli-edu-dev}
  bucket: ${MINIO_BUCKET:intelli-edu-resources}
  region: us-east-1
  presign-expiry-minutes: 15
  auto-create-bucket: true
  public-read: ${MINIO_PUBLIC_READ:true}

spnu:
  jdbc:
    database: intelli_edu_resource

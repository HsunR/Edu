spring:
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/dev-migration
    baseline-on-migrate: true
    baseline-version: 1
    clean-disabled: true
  mail:
    host: smtp.qq.com
    username: ${MAIL_USERNAME:local@example.invalid}
    password: ${MAIL_PASSWORD:local-disabled}
    protocol: smtps
    port: 465
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    enable-sql-runner: true
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      version-field: version

tencent:
  sms:
    secretId: ${TENCENT_CLOUD_SECRET_ID:local-disabled}
    secretKey: ${TENCENT_CLOUD_SECRET_KEY:local-disabled}
    sdk-app-id: ${TENCENT_SMS_APP_ID:0}
    sign-name: ${TENCENT_SMS_SIGN_NAME:local-disabled}
    template-id: ${TENCENT_SMS_TEMPLATE_ID:0}
    endpoint: sms.tencentcloudapi.com
    region: ap-guangzhou

spnu:
  jdbc:
    database: intelli_edu_user

user:
  defaults:
    avatar-url-prefix: http://localhost:5173/
    avatar-url: http://localhost:5173/favicon.ico
    personal-signature: "这个人很懒，什么都没有留下~"

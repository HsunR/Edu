spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    clean-disabled: true
  ai:
    deepseek:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:local-disabled}
      chat:
        options:
          model: deepseek-coder
          temperature: 0.7
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:local-disabled}
      chat:
        options:
          model: qwen-plus
    vectorstore:
      redis:
        initialize-schema: true
        prefix: Intelli-Edu-prefix
        index-name: Intelli-Edu-index

search-api:
  api-key: ${SEARCH_API_KEY:local-disabled}

spnu:
  jdbc:
    database: intelli_edu_ai
